# 发布：**人打标签触发，CI 执行**。
#
# 为什么不是"人手动跑 pnpm publish"：CI 是可复现的干净环境（依赖锁死、顺序固定：build → test →
# check:dist → publish），而且发布记录留在 Actions 里。人点头 = 打标签这一下。
#
# 标签形如 `@yozica/dsh-plugin-reveal@0.1.1`（由本地的 `pnpm changeset tag` 生成）——
# 每个包各自版本号，所以不能用单一的 vX.Y.Z。
#
# 认证 = **Trusted Publishing（GitHub OIDC）**，本仓不存任何 secret：
#   - 每个包要在 npmjs 的包页面 → Settings → Trusted Publisher 里配一次
#     （Organization or user = yozica，Repository = dsh-plugins，Workflow filename = release.yml）。
#     配好之前，CI 发布会以 ENEEDAUTH / 被掩盖的 404 失败 —— 见 docs/publishing.md。
#   - 因此这里必须给 id-token: write；同时**不要再设 NODE_AUTH_TOKEN**，否则 npm 会走 token 那条路。
#   - package.json 的 repository.url 必须与 GitHub 仓库完全一致，否则发布会 ENEEDAUTH。
name: release

on:
  push:
    tags:
      - '**@*'

permissions:
  contents: read
  id-token: write # ← Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile

      - name: 发布前三条硬检查
        run: pnpm build && pnpm test:only && pnpm check:dist

      - name: npm 版本够不够（Trusted Publishing 需要 ≥ 11.5.1）
        run: |
          NPM_V=$(npm -v)
          echo "npm $NPM_V"
          if [ "$(printf '%s\n' 11.5.1 "$NPM_V" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $NPM_V 太旧；Trusted Publishing 需要 npm ≥ 11.5.1。"
            exit 1
          fi

      - name: 发布（Trusted Publishing：无 token、无 secret）
        run: pnpm changeset publish

# PR 与 main 上的检查。**不发布** —— 发布由人点头后手动跑（见 README 的"发布"段）。
#
# 为什么用 corepack 而不是 pnpm/action-setup：版本已经在 package.json 的 `packageManager` 里钉死，
# corepack 直接照着它激活，少一个要跟着升的第三方 action。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - name: 构建（kit tsc → 插件 tsc + esbuild）
        run: pnpm build
      - name: 单测（纯逻辑 + 契约；测试解析的是构建产物，所以先构建）
        run: pnpm test:only
      - name: 类型
        run: pnpm typecheck
      - name: 产物形状（宿主认不认）
        run: pnpm check:dist
      - name: 格式
        run: pnpm format:check
